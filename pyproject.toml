[project]
name = "rtmw-preview"
version = "0.1.0"
description = "RTMW balanced camera preview with ONNX Runtime TensorRT FP16."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.19.0.56",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-nvjitlink-cu12==12.8.93",
    "onnxruntime-gpu[cuda,cudnn]==1.22.0",
    "opencv-python>=4.10,<5",
    "pyside6>=6.8,<7",
    "rtmlib==0.0.16",
    "tensorrt-cu12==10.9.0.34",
]

[project.scripts]
rtmw-preview = "rtmw_preview.app:main"
rtmw-download = "rtmw_preview.model:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
cache-dir = ".uv-cache"
override-dependencies = ["onnxruntime; sys_platform == 'never'", "opencv-contrib-python; sys_platform == 'never'"]

[tool.uv.build-backend]
module-name = "rtmw_preview"
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PTH",
    "RUF",
    "SIM",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=python_template",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["python_template"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
